<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardín Animado ✨</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <canvas id="sky-canvas"></canvas>

  <main>
    <header id="celebration-message">
      <h2>Gracias 🥰</h2>
      <h1>TE AMO MUCHO MI AMOR 💗🫶</h1>
    </header>

    <button id="heartBtn" class="action-btn" onclick="window.growGarden()">
      Ver Jardín de Flores 🌸
    </button>

    <div id="garden-container"></div>
  </main>

  <script>
    // --- 1. CONFIGURACIÓN DEL CIELO CON ESTRELLAS DE FONDO ---
    (function initSky() {
      const canvas = document.getElementById("sky-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      function resizeSky() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeSky();
      window.addEventListener("resize", resizeSky);

      const stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      }));

      function drawSky() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
          ctx.fill();
        });
        requestAnimationFrame(drawSky);
      }
      drawSky();
    })();

    // --- 2. FUNCIÓN GLOBAL DE CRECIMIENTO DEL JARDÍN ---
    window.growGarden = function() {
      const container = document.getElementById("garden-container");
      if (!container) return;

      // Inserción limpia del canvas del jardín
      container.innerHTML = `<canvas id="flowerCanvas" width="480" height="520"></canvas>`;
      const canvas = document.getElementById("flowerCanvas");
      const ctx = canvas.getContext("2d");

      let progress = 0; // Progreso de crecimiento de 0 a 1

      // Configuración de Flores (Tulipanes, 5-Pétalos y Lirios Araña)
      const flowers = [
        // Lirios Araña Neón (Nivel Superior)
        { type: 'spider', x: 240, maxY: 100, scale: 1.1 },
        { type: 'spider', x: 140, maxY: 160, scale: 0.9 },
        { type: 'spider', x: 340, maxY: 160, scale: 0.9 },

        // Tulipanes 3D Gradiente (Nivel Medio)
        { type: 'tulip',  x: 185, maxY: 200, scale: 1.0 },
        { type: 'tulip',  x: 295, maxY: 200, scale: 1.0 },
        { type: 'tulip',  x: 240, maxY: 245, scale: 1.15 },

        // Flores Rosas 5 Pétalos con Centro Amarillo (Nivel Base)
        { type: 'petal5', x: 150, maxY: 305, scale: 1.0 },
        { type: 'petal5', x: 330, maxY: 305, scale: 1.0 },
        { type: 'petal5', x: 240, maxY: 350, scale: 1.25 }
      ];

      // Partículas y Corazones Flotantes en Bucle
      const particles = Array.from({ length: 32 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 14 + 8,
        speed: Math.random() * 1.4 + 0.6,
        isHeart: Math.random() > 0.35,
        opacity: Math.random() * 0.7 + 0.3
      }));

      // DIBUJAR TALLOS CON HOJAS
      function drawStem(startX, startY, endX, endY, p) {
        const curY = startY - (startY - endY) * p;
        const midX = (startX + endX) / 2;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(midX, (startY + curY) / 2, endX, curY);
        ctx.strokeStyle = "#2e7d32";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.shadowColor = "#81c784";
        ctx.shadowBlur = 12;
        ctx.stroke();

        // Salida de hojas progresivas
        if (p > 0.4) {
          const leafScale = Math.min((p - 0.4) * 2, 1);
          drawLeaf((startX + endX) / 2 - 14, (startY + curY) / 2, -0.6, leafScale);
          drawLeaf((startX + endX) / 2 + 14, (startY + curY) / 2, 0.6, leafScale);
        }
        ctx.restore();
      }

      // DIBUJAR HOJAS
      function drawLeaf(x, y, angle, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(scale, scale);

        const grad = ctx.createLinearGradient(0, 0, 0, -30);
        grad.addColorStop(0, "#1b5e20");
        grad.addColorStop(1, "#66bb6a");

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-15, -15, 0, -30);
        ctx.quadraticCurveTo(15, -15, 0, 0);
        ctx.fillStyle = grad;
        ctx.shadowColor = "#a7f3d0";
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      // 1. TULIPÁN 3D
      function drawTulip(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const gradBody = ctx.createRadialGradient(0, -20, 5, 0, -20, 30);
        gradBody.addColorStop(0, "#ffb3c1");
        gradBody.addColorStop(0.6, "#ff2a75");
        gradBody.addColorStop(1, "#a00037");

        ctx.shadowColor = "#ff4081";
        ctx.shadowBlur = 18;

        // Pétalo Trasero
        ctx.beginPath();
        ctx.ellipse(0, -25, 22, 32, 0, 0, Math.PI * 2);
        ctx.fillStyle = gradBody;
        ctx.fill();

        // Pétalos Laterales
        ctx.beginPath();
        ctx.ellipse(-10, -20, 15, 28, -0.2, 0, Math.PI * 2);
        ctx.fillStyle = "#ff758f";
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(10, -20, 15, 28, 0.2, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4d6d";
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.stroke();

        // Centro Brillante
        const gradCenter = ctx.createLinearGradient(0, -40, 0, 0);
        gradCenter.addColorStop(0, "#ffffff");
        gradCenter.addColorStop(1, "#ff80ab");

        ctx.beginPath();
        ctx.ellipse(0, -18, 12, 24, 0, 0, Math.PI * 2);
        ctx.fillStyle = gradCenter;
        ctx.fill();

        ctx.restore();
      }

      // 2. FLOR 5 PÉTALOS CON CENTRO AMARILLO
      function drawPetal5(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.shadowColor = "#ff2a75";
        ctx.shadowBlur = 16;

        const petalGrad = ctx.createRadialGradient(0, -18, 2, 0, -18, 20);
        petalGrad.addColorStop(0, "#ffccd5");
        petalGrad.addColorStop(0.7, "#ff4d6d");
        petalGrad.addColorStop(1, "#c9184a");

        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.rotate((Math.PI * 2) / 5);
          ctx.ellipse(0, -20, 13, 24, 0, 0, Math.PI * 2);
          ctx.fillStyle = petalGrad;
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        // Botón Amarillo Brillante
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fillStyle = "#ffeb3b";
        ctx.shadowColor = "#ffff00";
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        ctx.restore();
      }

      // 3. LIRIO ARAÑA NEÓN
      function drawSpiderLily(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 20;

        const angles = [-0.8, -0.4, 0, 0.4, 0.8, 2.2, 2.6, 3.0, 3.4];
        angles.forEach((ang) => {
          ctx.save();
          ctx.rotate(ang);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-12, -25, 0, -40);
          ctx.quadraticCurveTo(12, -25, 0, 0);
          ctx.fillStyle = "#ff1744";
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 0.8;
          ctx.stroke();
          ctx.restore();
        });

        const stamens = [-1.0, -0.5, 0, 0.5, 1.0];
        stamens.forEach((st) => {
          ctx.save();
          ctx.rotate(st);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-15, -35, -22, -48);
          ctx.strokeStyle = "#ff80ab";
          ctx.lineWidth = 1.8;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(-22, -48, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffeb3b";
          ctx.shadowColor = "#ffff80";
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.restore();
        });

        ctx.restore();
      }

      // PARTÍCULAS / CORAZONES FLOTANTES
      function drawParticles() {
        particles.forEach((p) => {
          p.y -= p.speed;
          if (p.y < -20) p.y = canvas.height + 20;

          ctx.save();
          ctx.globalAlpha = p.opacity;
          if (p.isHeart) {
            ctx.font = `${p.size}px sans-serif`;
            ctx.fillText("💗", p.x, p.y);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
            ctx.strokeStyle = "#ff80ab";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#ff4081";
            ctx.shadowBlur = 12;
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      // BUCLE DE ANIMACIÓN
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawParticles();

        if (progress < 1) {
          progress += 0.009;
        }

        flowers.forEach((f) => {
          drawStem(240, 510, f.x, f.maxY, progress);

          if (progress > 0.5) {
            const flowerProgress = Math.min((progress - 0.5) * 2, 1);
            const currentScale = f.scale * flowerProgress;

            if (f.type === 'tulip') drawTulip(f.x, f.maxY, currentScale);
            if (f.type === 'petal5') drawPetal5(f.x, f.maxY, currentScale);
            if (f.type === 'spider') drawSpiderLily(f.x, f.maxY, currentScale);
          }
        });

        requestAnimationFrame(animate);
      }

      animate();
    };

    // Vínculo secundario seguro por si acaso
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("heartBtn");
      if (btn) {
        btn.addEventListener("click", () => window.growGarden());
      }
    });
  </script>
</body>
</html>
