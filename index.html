<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Música de fondo -->
  <audio id="bg-music" src="musica.mp3" loop preload="auto"></audio>

  <!-- Canvas para el fondo estrellado -->
  <canvas id="sky-canvas"></canvas>

  <!-- PANTALLA DE INICIO -->
  <section id="hero" class="hero-screen">
    <div class="hero-content">
      <h1 class="sparkle-title">🌅 Un Regalo Especial</h1>
      <p>Haz clic para descubrir lo que guardo para ti</p>
      <button id="start-btn" class="glow-btn">Ábrelo ❤️</button>
    </div>
  </section>

  <!-- ESCENA PRINCIPAL -->
  <main id="main-scene" class="hidden">
    
    <!-- 1. Jardín de Tulipanes -->
    <div id="garden-container"></div>

    <!-- 2. Carta con efecto Máquina de Escribir -->
    <div id="typewriter-container" class="message-card hidden-element">
      <p id="typewriter-text"></p>
    </div>

    <!-- 3. Galería Polaroid -->
    <section id="photos-section" class="gallery-section hidden-element">
      <div class="polaroid-grid">
        <div class="polaroid">
          <img src="foto1.jpg" alt="Foto 1">
          <p>Nuestros primeros momentos ✨</p>
        </div>
        <div class="polaroid">
          <img src="foto2.jpg" alt="Foto 2">
          <p>Risas inolvidables 💖</p>
        </div>
        <div class="polaroid">
          <img src="foto3.jpg" alt="Foto 3">
          <p>Siempre tú 🌷</p>
        </div>
      </div>
    </section>

    <!-- 4. Corazón Interactivo -->
    <div id="heart-section" class="interactive-heart-container hidden-element">
      <button id="heart-btn" class="pulse-heart">❤️</button>
      <p class="heart-hint">Tócame para una sorpresa</p>
    </div>

    <!-- 5. Propuesta y Cierre -->
    <footer id="final-section" class="final-message hidden-element">
      <p class="question-text">"Sería tan afortunado de tenerte siempre a mi lado" 🌷❤️</p>
      
      <div id="proposal-buttons" class="proposal-container">
        <button id="accept-btn" class="choice-btn accept">Aceptar 🥺</button>
        <button id="reject-btn" class="choice-btn reject">Rechazar 😞</button>
      </div>

      <div id="celebration-message" class="celebration hidden-element">
        <h2>Gracias 🥰</h2>
        <h1>TE AMO MUCHO MI AMOR 💗🫶</h1>
      </div>
    </footer>

  </main>

  <script>
    window.addEventListener("load", () => {
      const startBtn = document.getElementById("start-btn");
      const hero = document.getElementById("hero");
      const mainScene = document.getElementById("main-scene");
      const bgMusic = document.getElementById("bg-music");
      const heartBtn = document.getElementById("heart-btn");

      const typewriterElement = document.getElementById("typewriter-text");
      const messageText = "Estas flores jamás podrán compararse con lo hermosa que eres, pero quería regalarte un pequeño jardín que florezca cada vez que pienses en nosotros. ❤️";

      // Canvas y Estrellas
      const canvas = document.getElementById("sky-canvas");
      const ctx = canvas.getContext("2d");
      let width, height;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2,
        alpha: Math.random(),
        speed: Math.random() * 0.02
      }));

      function animateSky() {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(star => {
          star.alpha += star.speed;
          if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(animateSky);
      }
      animateSky();
    
  // Función para generar el Ramo HD 3D estilo Referencia + Corazones Flotantes
function growGarden() {
  const garden = document.getElementById("garden-container");
  garden.innerHTML = "";

  const bouquetHTML = `
    <div class="bouquet-wrapper">
      <svg class="bouquet-svg" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Filtro Neón Luminous -->
          <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComponentTransfer in="blur" result="glow">
              <feFuncA type="linear" slope="1.8"/>
            </feComponentTransfer>
            <feMerge>
              <feMergeNode in="glow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Gradiente Papel Kraft (Estilo Foto 1) -->
          <linearGradient id="kraftPaper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5d6ba"/>
            <stop offset="50%" stop-color="#e6b894"/>
            <stop offset="100%" stop-color="#c8966b"/>
          </linearGradient>
          
          <linearGradient id="kraftInner" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#d4a373"/>
            <stop offset="100%" stop-color="#a37248"/>
          </linearGradient>

          <!-- Gradientes Tallo e Hojas -->
          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2e7d32"/>
            <stop offset="50%" stop-color="#4caf50"/>
            <stop offset="100%" stop-color="#1b5e20"/>
          </linearGradient>

          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#66bb6a"/>
            <stop offset="100%" stop-color="#1b5e20"/>
          </linearGradient>

          <!-- Gradiente Tulipán 3D (Foto 1) -->
          <radialGradient id="tulipBody" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ff9ebb"/>
            <stop offset="65%" stop-color="#ff2a75"/>
            <stop offset="100%" stop-color="#b70043"/>
          </radialGradient>
          
          <radialGradient id="tulipLight" cx="50%" cy="20%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#ff80ab"/>
          </radialGradient>

          <!-- Gradiente Flor 5 Pétalos (Foto 2) -->
          <radialGradient id="petal5Grad" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffccd5"/>
            <stop offset="60%" stop-color="#ff758f"/>
            <stop offset="100%" stop-color="#c9184a"/>
          </radialGradient>

          <!-- MOLDE 1: TULIPÁN 3D (Foto 1) -->
          <g id="tulip-3d" filter="url(#neonGlow)">
            <!-- Base / Cuerpo exterior -->
            <path d="M0,0 C-22,-20 -25,-50 0,-65 C25,-50 22,-20 0,0 Z" fill="url(#tulipBody)" stroke="#ffb3c1" stroke-width="2"/>
            <!-- Pétalo Izquierdo -->
            <path d="M-15,-8 C-28,-28 -18,-55 0,-65 C6,-40 0,-20 -15,-8 Z" fill="url(#tulipLight)" opacity="0.85" stroke="#ff80ab" stroke-width="1.2"/>
            <!-- Pétalo Derecho -->
            <path d="M15,-8 C28,-28 18,-55 0,-65 C-6,-40 0,-20 15,-8 Z" fill="url(#tulipBody)" opacity="0.9" stroke="#ff80ab" stroke-width="1.2"/>
            <!-- Pétalo Central Brillante -->
            <path d="M0,-5 C-12,-20 -10,-50 0,-60 C10,-50 12,-20 0,-5 Z" fill="url(#tulipLight)" opacity="0.95" stroke="#ffffff" stroke-width="1.5"/>
            <!-- Anillo Base -->
            <ellipse cx="0" cy="-2" rx="6" ry="3" fill="#ff4081"/>
          </g>

          <!-- MOLDE 2: FLOR 5 PÉTALOS (Foto 2) -->
          <g id="flower-5p" filter="url(#neonGlow)">
            <!-- 5 Pétalos -->
            <path d="M0,-8 C-12,-25 -5,-38 0,-40 C5,-38 12,-25 0,-8 Z" fill="url(#petal5Grad)" stroke="#ffb3c1" stroke-width="1"/>
            <path d="M0,-8 C-12,-25 -5,-38 0,-40 C5,-38 12,-25 0,-8 Z" fill="url(#petal5Grad)" stroke="#ffb3c1" stroke-width="1" transform="rotate(72)"/>
            <path d="M0,-8 C-12,-25 -5,-38 0,-40 C5,-38 12,-25 0,-8 Z" fill="url(#petal5Grad)" stroke="#ffb3c1" stroke-width="1" transform="rotate(144)"/>
            <path d="M0,-8 C-12,-25 -5,-38 0,-40 C5,-38 12,-25 0,-8 Z" fill="url(#petal5Grad)" stroke="#ffb3c1" stroke-width="1" transform="rotate(216)"/>
            <path d="M0,-8 C-12,-25 -5,-38 0,-40 C5,-38 12,-25 0,-8 Z" fill="url(#petal5Grad)" stroke="#ffb3c1" stroke-width="1" transform="rotate(288)"/>
            <!-- Centro Amarillo Brillante de Foto 2 -->
            <circle cx="0" cy="-8" r="7" fill="#fff59d" stroke="#ffee58" stroke-width="2"/>
            <circle cx="0" cy="-8" r="3" fill="#ffffff"/>
          </g>

          <!-- MOLDE 3: LIRIO ARAÑA REDISEÑADO 3D -->
          <g id="spider-3d" filter="url(#neonGlow)">
            <path d="M0,0 Q-20,-20 -35,-15 Q-20,-5 0,0" fill="#ff1744" stroke="#ffffff" stroke-width="1"/>
            <path d="M0,0 Q20,-20 35,-15 Q20,-5 0,0" fill="#ff1744" stroke="#ffffff" stroke-width="1"/>
            <path d="M0,0 Q-25,-5 -38,15 Q-20,5 0,0" fill="#d50000" stroke="#ff80ab" stroke-width="1"/>
            <path d="M0,0 Q25,-5 38,15 Q20,5 0,0" fill="#d50000" stroke="#ff80ab" stroke-width="1"/>
            <path d="M0,0 Q-12,-32 0,-42 Q12,-32 0,0" fill="#ff1744" stroke="#ffffff" stroke-width="1"/>
            <!-- Estambres Neón -->
            <path d="M0,0 Q-28,-35 -40,-30 M0,0 Q28,-35 40,-30 M0,0 Q-15,-45 -18,-50 M0,0 Q15,-45 18,-50" stroke="#ff80ab" stroke-width="2" fill="none"/>
            <circle cx="-40" cy="-30" r="2.5" fill="#ffeb3b"/>
            <circle cx="40" cy="-30" r="2.5" fill="#ffeb3b"/>
            <circle cx="-18" cy="-50" r="2.5" fill="#ffeb3b"/>
            <circle cx="18" cy="-50" r="2.5" fill="#ffeb3b"/>
          </g>

          <!-- MOLDE HOJA -->
          <g id="leaf">
            <path d="M0,0 C-15,-10 -20,-30 0,-40 C20,-30 15,-10 0,0 Z" fill="url(#leafGrad)"/>
            <path d="M0,0 L0,-38" stroke="#81c784" stroke-width="1"/>
          </g>
        </defs>

        <!-- LUZ DE FONDO CÁLIDA -->
        <circle cx="200" cy="220" r="150" fill="#ff80ab" opacity="0.2" filter="blur(30px)"/>

        <!-- TALLOS Y HOJAS DISTRIBUIDAS (Foto 1) -->
        <g>
          <!-- Tallos principales -->
          <line x1="200" y1="200" x2="185" y2="430" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
          <line x1="160" y1="220" x2="190" y2="430" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
          <line x1="240" y1="220" x2="200" y2="430" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
          <line x1="120" y1="250" x2="180" y2="430" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
          <line x1="280" y1="250" x2="210" y2="430" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>

          <!-- Hojas a los lados de los tallos -->
          <use href="#leaf" x="150" y="320" transform="scale(0.8) rotate(-40)"/>
          <use href="#leaf" x="250" y="320" transform="scale(0.8) rotate(40)"/>
          <use href="#leaf" x="170" y="270" transform="scale(0.7) rotate(-30)"/>
          <use href="#leaf" x="230" y="270" transform="scale(0.7) rotate(30)"/>
          <use href="#leaf" x="130" y="360" transform="scale(0.9) rotate(-50)"/>
          <use href="#leaf" x="270" y="360" transform="scale(0.9) rotate(50)"/>
        </g>

        <!-- ARREGLO DE FLORES 3D -->
        <!-- Tulipanes de la Foto 1 -->
        <use href="#tulip-3d" x="200" y="110" transform="scale(1.1)"/>
        <use href="#tulip-3d" x="150" y="150"/>
        <use href="#tulip-3d" x="250" y="150"/>
        <use href="#tulip-3d" x="200" y="190"/>
        <use href="#tulip-3d" x="110" y="210" transform="scale(0.95)"/>
        <use href="#tulip-3d" x="290" y="210" transform="scale(0.95)"/>

        <!-- Flores 5 Pétalos de la Foto 2 -->
        <use href="#flower-5p" x="200" y="250" transform="scale(1.2)"/>
        <use href="#flower-5p" x="150" y="270"/>
        <use href="#flower-5p" x="250" y="270"/>
        <use href="#flower-5p" x="110" y="290" transform="scale(0.9)"/>
        <use href="#flower-5p" x="290" y="290" transform="scale(0.9)"/>

        <!-- Lirios Araña 3D -->
        <use href="#spider-3d" x="200" y="60" transform="scale(1.1)"/>
        <use href="#spider-3d" x="80" y="150"/>
        <use href="#spider-3d" x="320" y="150"/>
        <use href="#spider-3d" x="150" y="200" transform="scale(0.9)"/>
        <use href="#spider-3d" x="250" y="200" transform="scale(0.9)"/>

        <!-- PAPEL KRAFT / BEIGE ENVOLTURA (Estilo Foto 1) -->
        <g>
          <!-- Capa interior sombra -->
          <path d="M 70 300 L 170 470 L 230 470 L 330 300 Z" fill="url(#kraftInner)"/>
          
          <!-- Pliegue Izquierdo -->
          <path d="M 50 280 C 80 340, 120 420, 185 470 L 140 470 C 90 410, 50 340, 30 290 Z" fill="url(#kraftPaper)" stroke="#d4a373" stroke-width="1"/>
          <path d="M 50 280 L 180 430 Q 200 450 220 430 L 350 280 L 370 310 L 200 480 L 30 310 Z" fill="url(#kraftPaper)" stroke="#e6b894" stroke-width="1.5"/>

          <!-- Lazo Rosado de Foto 1 -->
          <path d="M 160 420 Q 200 410 240 420 Q 220 440 200 430 Q 180 440 160 420 Z" fill="#ff80ab" stroke="#ffffff" stroke-width="1"/>
          <circle cx="200" cy="425" r="6" fill="#ff4081"/>
          <path d="M 195 428 Q 180 460 160 490 L 175 492 Q 196 462 200 428 Z" fill="#ff80ab"/>
          <path d="M 205 428 Q 220 460 240 490 L 225 492 Q 204 462 200 428 Z" fill="#ff80ab"/>
        </g>
      </svg>
    </div>
  `;

  garden.innerHTML = bouquetHTML;

  // Iniciar la animación de Corazones y Círculos Flotantes (Foto 2)
  startFloatingHearts();
}

// Lógica de partículas flotantes rodeando el ramo
function startFloatingHearts() {
  const container = document.getElementById("garden-container");
  
  setInterval(() => {
    const isHeart = Math.random() > 0.4;
    const element = document.createElement("div");
    
    if (isHeart) {
      element.className = "floating-heart";
      element.innerHTML = "💗";
      element.style.fontSize = (Math.random() * 16 + 12) + "px";
    } else {
      element.className = "floating-bubble";
      element.innerHTML = "⭕";
      element.style.fontSize = (Math.random() * 14 + 10) + "px";
      element.style.color = "#ff80ab";
    }

    // Posición aleatoria horizontal alrededor del ramo
    element.style.left = (Math.random() * 70 + 15) + "%";
    element.style.bottom = "10px";
    
    // Duración de la subida
    const duration = Math.random() * 3 + 3.5;
    element.style.animationDuration = duration + "s";

    container.appendChild(element);

    setTimeout(() => {
      element.remove();
    }, duration * 1000);
  }, 350);
}


      // Al hacer clic en "Ábrelo ❤️"
      startBtn.onclick = function() {
        if(bgMusic) {
          bgMusic.play().catch(e => console.log(e));
        }
        
        hero.classList.add("fade-out");

        setTimeout(() => {
          hero.style.display = "none";
          mainScene.classList.remove("hidden");

          // 1. Crecen tulipanes
          growGarden();

          // 2. Carta
          setTimeout(() => {
            document.getElementById("typewriter-container").classList.add("show-element");
            startTypewriter();
          }, 3500);

          // 3. Fotos
          setTimeout(() => {
            document.getElementById("photos-section").classList.add("show-element");
          }, 8500);

          // 4. Corazón y propuesta
          setTimeout(() => {
            document.getElementById("heart-section").classList.add("show-element");
            document.getElementById("final-section").classList.add("show-element");
          }, 11000);

        }, 1500);
      };

      // Máquina de escribir
      function startTypewriter() {
        let index = 0;
        typewriterElement.textContent = "";
        const timer = setInterval(() => {
          if (index < messageText.length) {
            typewriterElement.textContent += messageText.charAt(index);
            index++;
          } else {
            clearInterval(timer);
          }
        }, 45);
      }

      // Click corazón
      heartBtn.onclick = function() {
        alert("¡Eres mi persona favorita en todo el universo! 💖✨");
        createPetalBurst();
      };

      function createPetalBurst() {
        for (let i = 0; i < 20; i++) {
          const petal = document.createElement("div");
          petal.innerHTML = "🌸";
          petal.className = "falling-petal";
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.fontSize = Math.random() * 20 + 15 + "px";
          petal.style.animationDuration = (Math.random() * 2 + 2) + "s";
          document.body.appendChild(petal);
          setTimeout(() => petal.remove(), 4000);
        }
      }

      // Botones Aceptar / Rechazar
      const acceptBtn = document.getElementById("accept-btn");
      const rejectBtn = document.getElementById("reject-btn");
      const proposalButtons = document.getElementById("proposal-buttons");
      const celebrationMessage = document.getElementById("celebration-message");

      let rejectClicks = 0;

      rejectBtn.onclick = function() {
        rejectClicks++;

        if (rejectClicks <= 4) {
          const acceptScale = 1 + (rejectClicks * 0.35);
          const acceptFontSize = 1.1 + (rejectClicks * 0.2);
          acceptBtn.style.transform = `scale(${acceptScale})`;
          acceptBtn.style.fontSize = `${acceptFontSize}rem`;

          const rejectScale = 1 - (rejectClicks * 0.18);
          const rejectFontSize = 1.1 - (rejectClicks * 0.15);
          rejectBtn.style.transform = `scale(${rejectScale})`;
          rejectBtn.style.fontSize = `${rejectFontSize}rem`;
        } else {
          rejectClicks = 0;
          acceptBtn.style.transform = "scale(1)";
          acceptBtn.style.fontSize = "1.1rem";
          rejectBtn.style.transform = "scale(1)";
          rejectBtn.style.fontSize = "1.1rem";
        }
      };

      acceptBtn.onclick = function() {
        proposalButtons.style.display = "none";
        celebrationMessage.classList.remove("hidden-element");
        celebrationMessage.classList.add("show-element");
        startInfinitePetals();
      };

      function startInfinitePetals() {
        const petals = ["🌸", "🌺", "🌷", "💖"];
        setInterval(() => {
          const petal = document.createElement("div");
          petal.className = "falling-petal";
          petal.textContent = petals[Math.floor(Math.random() * petals.length)];
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.fontSize = Math.random() * 15 + 15 + "px";
          
          const duration = Math.random() * 3 + 3;
          petal.style.animationDuration = duration + "s";

          document.body.appendChild(petal);
          setTimeout(() => petal.remove(), duration * 1000);
        }, 250);
      }
    });
  </script>
</body>
</html>
