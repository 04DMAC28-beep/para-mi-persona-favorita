<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Música de fondo -->
  <audio id="bg-music" src="musica.mp3" loop preload="auto"></audio>

  <!-- Canvas para el fondo estrellado -->
  <canvas id="sky-canvas"></canvas>

  <!-- PANTALLA DE INICIO -->
  <section id="hero" class="hero-screen">
    <div class="hero-content">
      <h1 class="sparkle-title">🌅 Un Regalo Especial</h1>
      <p>Haz clic para descubrir lo que guardo para ti</p>
      <button id="start-btn" class="glow-btn">Ábrelo ❤️</button>
    </div>
  </section>

  <!-- ESCENA PRINCIPAL -->
  <main id="main-scene" class="hidden">
    
    <!-- 1. Jardín de Tulipanes -->
    <div id="garden-container"></div>

    <!-- 2. Carta con efecto Máquina de Escribir -->
    <div id="typewriter-container" class="message-card hidden-element">
      <p id="typewriter-text"></p>
    </div>

    <!-- 3. Galería Polaroid -->
    <section id="photos-section" class="gallery-section hidden-element">
      <div class="polaroid-grid">
        <div class="polaroid">
          <img src="foto1.jpg" alt="Foto 1">
          <p>Nuestros primeros momentos ✨</p>
        </div>
        <div class="polaroid">
          <img src="foto2.jpg" alt="Foto 2">
          <p>Risas inolvidables 💖</p>
        </div>
        <div class="polaroid">
          <img src="foto3.jpg" alt="Foto 3">
          <p>Siempre tú 🌷</p>
        </div>
      </div>
    </section>

    <!-- 4. Corazón Interactivo -->
    <div id="heart-section" class="interactive-heart-container hidden-element">
      <button id="heart-btn" class="pulse-heart">❤️</button>
      <p class="heart-hint">Tócame para una sorpresa</p>
    </div>

    <!-- 5. Propuesta y Cierre -->
    <footer id="final-section" class="final-message hidden-element">
      <p class="question-text">"Sería tan afortunado de tenerte siempre a mi lado" 🌷❤️</p>
      
      <div id="proposal-buttons" class="proposal-container">
        <button id="accept-btn" class="choice-btn accept">Aceptar 🥺</button>
        <button id="reject-btn" class="choice-btn reject">Rechazar 😞</button>
      </div>

      <div id="celebration-message" class="celebration hidden-element">
        <h2>Gracias 🥰</h2>
        <h1>TE AMO MUCHO MI AMOR 💗🫶</h1>
      </div>
    </footer>

  </main>

  <script>
    window.addEventListener("load", () => {
      const startBtn = document.getElementById("start-btn");
      const hero = document.getElementById("hero");
      const mainScene = document.getElementById("main-scene");
      const bgMusic = document.getElementById("bg-music");
      const heartBtn = document.getElementById("heart-btn");

      const typewriterElement = document.getElementById("typewriter-text");
      const messageText = "Estas flores jamás podrán compararse con lo hermosa que eres, pero quería regalarte un pequeño jardín que florezca cada vez que pienses en nosotros. ❤️";

      // Canvas y Estrellas
      const canvas = document.getElementById("sky-canvas");
      const ctx = canvas.getContext("2d");
      let width, height;

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2,
        alpha: Math.random(),
        speed: Math.random() * 0.02
      }));

      function animateSky() {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(star => {
          star.alpha += star.speed;
          if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(animateSky);
      }
      animateSky();
    
// Función para generar el Ramo Elegante con Papel Coreano y Flores Mixtas
function growGarden() {
  const garden = document.getElementById("garden-container");
  garden.innerHTML = "";

  const bouquetHTML = `
    <div class="bouquet-wrapper">
      <svg class="bouquet-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradientes Papel Coreano -->
          <linearGradient id="koreanPink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#f472b6" stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="koreanWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
            <stop offset="100%" stop-color="#f3f4f6" stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ec4899"/>
            <stop offset="100%" stop-color="#be185d"/>
          </linearGradient>

          <!-- Gradientes Flores -->
          <linearGradient id="tulipWhite" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
          </linearGradient>
          <linearGradient id="tulipPink" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fce7f3"/>
            <stop offset="100%" stop-color="#f472b6"/>
          </linearGradient>
          <linearGradient id="roseWhite" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
          </linearGradient>
          <linearGradient id="rosePink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbcfe8"/>
            <stop offset="100%" stop-color="#db2777"/>
          </linearGradient>
          <linearGradient id="spiderRed" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff1744"/>
            <stop offset="100%" stop-color="#990000"/>
          </linearGradient>

          <!-- Moldes / Macros de Flores -->
          <!-- Tulipán -->
          <g id="tulip-w">
            <path d="M 0 0 C -12 -15, -15 -35, 0 -45 C 15 -35, 12 -15, 0 0 Z" fill="url(#tulipWhite)" />
            <path d="M -8 -5 C -18 -20, -10 -38, 0 -45 C 5 -30, 0 -15, -8 -5 Z" fill="#f8fafc" opacity="0.8"/>
            <path d="M 8 -5 C 18 -20, 10 -38, 0 -45 C -5 -30, 0 -15, 8 -5 Z" fill="#e2e8f0" opacity="0.8"/>
          </g>
          <g id="tulip-p">
            <path d="M 0 0 C -12 -15, -15 -35, 0 -45 C 15 -35, 12 -15, 0 0 Z" fill="url(#tulipPink)" />
            <path d="M -8 -5 C -18 -20, -10 -38, 0 -45 C 5 -30, 0 -15, -8 -5 Z" fill="#fbcfe8" opacity="0.8"/>
            <path d="M 8 -5 C 18 -20, 10 -38, 0 -45 C -5 -30, 0 -15, 8 -5 Z" fill="#f472b6" opacity="0.8"/>
          </g>

          <!-- Rosa -->
          <g id="rose-w">
            <circle cx="0" cy="-15" r="16" fill="url(#roseWhite)"/>
            <path d="M -10 -20 C -5 -28, 5 -28, 10 -20 C 12 -10, -12 -10, -10 -20 Z" fill="#e2e8f0"/>
            <path d="M -6 -14 C -2 -20, 2 -20, 6 -14 C 8 -8, -8 -8, -6 -14 Z" fill="#ffffff"/>
          </g>
          <g id="rose-p">
            <circle cx="0" cy="-15" r="16" fill="url(#rosePink)"/>
            <path d="M -10 -20 C -5 -28, 5 -28, 10 -20 C 12 -10, -12 -10, -10 -20 Z" fill="#f472b6"/>
            <path d="M -6 -14 C -2 -20, 2 -20, 6 -14 C 8 -8, -8 -8, -6 -14 Z" fill="#fbcfe8"/>
          </g>

          <!-- Lirio Araña Rojo -->
          <g id="spider-lily">
            <path d="M0,0 Q-15,-15 -25,-10 Q-15,-5 0,0" fill="url(#spiderRed)"/>
            <path d="M0,0 Q15,-15 25,-10 Q15,-5 0,0" fill="url(#spiderRed)"/>
            <path d="M0,0 Q-18,-5 -28,10 Q-15,5 0,0" fill="url(#spiderRed)"/>
            <path d="M0,0 Q18,-5 28,10 Q15,5 0,0" fill="url(#spiderRed)"/>
            <path d="M0,0 Q-8,-25 0,-32 Q8,-25 0,0" fill="url(#spiderRed)"/>
            <!-- Estambres -->
            <path d="M0,0 Q-20,-28 -30,-25 M0,0 Q20,-28 30,-25 M0,0 Q-10,-35 -12,-38 M0,0 Q10,-35 12,-38 M0,0 Q-25,-12 -35,-8 M0,0 Q25,-12 35,-8" stroke="#ff80ab" stroke-width="1.2" fill="none"/>
            <circle cx="-30" cy="-25" r="1.5" fill="#ffd700"/>
            <circle cx="30" cy="-25" r="1.5" fill="#ffd700"/>
            <circle cx="-12" cy="-38" r="1.5" fill="#ffd700"/>
            <circle cx="12" cy="-38" r="1.5" fill="#ffd700"/>
            <circle cx="-35" cy="-8" r="1.5" fill="#ffd700"/>
            <circle cx="35" cy="-8" r="1.5" fill="#ffd700"/>
          </g>
        </defs>

        <!-- CAPA POSTERIOR PAPEL COREANO -->
        <path d="M 60 220 L 120 450 L 280 450 L 340 220 L 370 120 L 200 170 L 30 120 Z" fill="url(#koreanPink)" opacity="0.85"/>
        <path d="M 80 200 L 130 440 L 270 440 L 320 200 L 350 100 L 200 150 L 50 100 Z" fill="url(#koreanWhite)"/>

        <!-- TALLOS -->
        <g stroke="#2e7d32" stroke-width="3" opacity="0.7">
          <line x1="200" y1="200" x2="180" y2="420"/>
          <line x1="180" y1="200" x2="195" y2="420"/>
          <line x1="220" y1="200" x2="210" y2="420"/>
        </g>

        <!-- ARREGLO DE FLORES -->
        <!-- 4 Tulipanes Blancos -->
        <use href="#tulip-w" x="140" y="210" transform="scale(0.9)"/>
        <use href="#tulip-w" x="240" y="210" transform="scale(0.9)"/>
        <use href="#tulip-w" x="180" y="160" transform="scale(0.95)"/>
        <use href="#tulip-w" x="210" y="160" transform="scale(0.95)"/>

        <!-- 4 Tulipanes Rosados Bajas -->
        <use href="#tulip-p" x="120" y="250" transform="scale(0.95)"/>
        <use href="#tulip-p" x="260" y="250" transform="scale(0.95)"/>
        <use href="#tulip-p" x="160" y="180"/>
        <use href="#tulip-p" x="230" y="180"/>

        <!-- 3 Rosas Blancas -->
        <use href="#rose-w" x="150" y="230"/>
        <use href="#rose-w" x="240" y="230"/>
        <use href="#rose-w" x="195" y="140"/>

        <!-- 3 Rosas Rosadas Bajas -->
        <use href="#rose-p" x="195" y="220" transform="scale(1.1)"/>
        <use href="#rose-p" x="160" y="280"/>
        <use href="#rose-p" x="230" y="280"/>

        <!-- 8 Lirios Araña Rojos (Distribuidos para enmarcar el ramo) -->
        <use href="#spider-lily" x="100" y="160"/>
        <use href="#spider-lily" x="290" y="160"/>
        <use href="#spider-lily" x="70" y="220"/>
        <use href="#spider-lily" x="320" y="220"/>
        <use href="#spider-lily" x="120" y="120"/>
        <use href="#spider-lily" x="270" y="120"/>
        <use href="#spider-lily" x="195" y="100" transform="scale(1.1)"/>
        <use href="#spider-lily" x="195" y="270"/>

        <!-- CAPA FRONTAL PAPEL COREANO (PLIEGUES FRONTALES Y LAZO) -->
        <path d="M 70 260 L 140 430 Q 200 450 260 430 L 330 260 Q 200 310 70 260 Z" fill="url(#koreanWhite)" opacity="0.95"/>
        <path d="M 90 280 L 150 430 Q 200 445 250 430 L 310 280 Q 200 320 90 280 Z" fill="url(#koreanPink)" opacity="0.85"/>

        <!-- Lazo Elegante -->
        <path d="M 170 375 Q 200 365 230 375 Q 210 395 200 385 Q 190 395 170 375 Z" fill="url(#ribbonGrad)"/>
        <circle cx="200" cy="378" r="6" fill="#be185d"/>
        <!-- Caídas del Lazo -->
        <path d="M 196 382 Q 185 420 165 450 L 180 452 Q 198 422 200 382 Z" fill="url(#ribbonGrad)"/>
        <path d="M 204 382 Q 215 420 235 450 L 220 452 Q 202 422 200 382 Z" fill="url(#ribbonGrad)"/>
      </svg>
    </div>
  `;

  garden.innerHTML = bouquetHTML;
}

      // Al hacer clic en "Ábrelo ❤️"
      startBtn.onclick = function() {
        if(bgMusic) {
          bgMusic.play().catch(e => console.log(e));
        }
        
        hero.classList.add("fade-out");

        setTimeout(() => {
          hero.style.display = "none";
          mainScene.classList.remove("hidden");

          // 1. Crecen tulipanes
          growGarden();

          // 2. Carta
          setTimeout(() => {
            document.getElementById("typewriter-container").classList.add("show-element");
            startTypewriter();
          }, 3500);

          // 3. Fotos
          setTimeout(() => {
            document.getElementById("photos-section").classList.add("show-element");
          }, 8500);

          // 4. Corazón y propuesta
          setTimeout(() => {
            document.getElementById("heart-section").classList.add("show-element");
            document.getElementById("final-section").classList.add("show-element");
          }, 11000);

        }, 1500);
      };

      // Máquina de escribir
      function startTypewriter() {
        let index = 0;
        typewriterElement.textContent = "";
        const timer = setInterval(() => {
          if (index < messageText.length) {
            typewriterElement.textContent += messageText.charAt(index);
            index++;
          } else {
            clearInterval(timer);
          }
        }, 45);
      }

      // Click corazón
      heartBtn.onclick = function() {
        alert("¡Eres mi persona favorita en todo el universo! 💖✨");
        createPetalBurst();
      };

      function createPetalBurst() {
        for (let i = 0; i < 20; i++) {
          const petal = document.createElement("div");
          petal.innerHTML = "🌸";
          petal.className = "falling-petal";
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.fontSize = Math.random() * 20 + 15 + "px";
          petal.style.animationDuration = (Math.random() * 2 + 2) + "s";
          document.body.appendChild(petal);
          setTimeout(() => petal.remove(), 4000);
        }
      }

      // Botones Aceptar / Rechazar
      const acceptBtn = document.getElementById("accept-btn");
      const rejectBtn = document.getElementById("reject-btn");
      const proposalButtons = document.getElementById("proposal-buttons");
      const celebrationMessage = document.getElementById("celebration-message");

      let rejectClicks = 0;

      rejectBtn.onclick = function() {
        rejectClicks++;

        if (rejectClicks <= 4) {
          const acceptScale = 1 + (rejectClicks * 0.35);
          const acceptFontSize = 1.1 + (rejectClicks * 0.2);
          acceptBtn.style.transform = `scale(${acceptScale})`;
          acceptBtn.style.fontSize = `${acceptFontSize}rem`;

          const rejectScale = 1 - (rejectClicks * 0.18);
          const rejectFontSize = 1.1 - (rejectClicks * 0.15);
          rejectBtn.style.transform = `scale(${rejectScale})`;
          rejectBtn.style.fontSize = `${rejectFontSize}rem`;
        } else {
          rejectClicks = 0;
          acceptBtn.style.transform = "scale(1)";
          acceptBtn.style.fontSize = "1.1rem";
          rejectBtn.style.transform = "scale(1)";
          rejectBtn.style.fontSize = "1.1rem";
        }
      };

      acceptBtn.onclick = function() {
        proposalButtons.style.display = "none";
        celebrationMessage.classList.remove("hidden-element");
        celebrationMessage.classList.add("show-element");
        startInfinitePetals();
      };

      function startInfinitePetals() {
        const petals = ["🌸", "🌺", "🌷", "💖"];
        setInterval(() => {
          const petal = document.createElement("div");
          petal.className = "falling-petal";
          petal.textContent = petals[Math.floor(Math.random() * petals.length)];
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.fontSize = Math.random() * 15 + 15 + "px";
          
          const duration = Math.random() * 3 + 3;
          petal.style.animationDuration = duration + "s";

          document.body.appendChild(petal);
          setTimeout(() => petal.remove(), duration * 1000);
        }, 250);
      }
    });
  </script>
</body>
</html>
