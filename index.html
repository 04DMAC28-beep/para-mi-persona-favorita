<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti ❤️</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuente elegante desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Elemento para reproducir la canción (Asegúrate de incluir una canción llamada musica.mp3 en tu carpeta) -->
  <audio id="bg-music" src="musica.mp3" loop></audio>

  <!-- Canvas para partículas (estrellas, estrellas fugaces, pétalos) -->
  <canvas id="sky-canvas"></canvas>

  <!-- PANTALLA DE INICIO -->
  <section id="hero" class="hero-screen">
    <div class="hero-content">
      <h1 class="sparkle-title">🌅 Un Regalo Especial</h1>
      <p>Haz clic para descubrir lo que guardo para ti</p>
      <button id="start-btn" class="glow-btn">Ábrelo ❤️</button>
    </div>
  </section>

  <!-- ESCENA PRINCIPAL (Jardín y Contenidos) -->
  <main id="main-scene" class="hidden">
    
    <!-- Mensaje Tipo Máquina de Escribir -->
    <div id="typewriter-container" class="message-card">
      <p id="typewriter-text"></p>
    </div>

    <!-- Galería Polaroid -->
    <section class="gallery-section">
      <div class="polaroid-grid">
        <div class="polaroid">
          <img src="foto1.jpg" alt="Momento juntos 1">
          <p>Nuestros primeros momentos ✨</p>
        </div>
        <div class="polaroid">
          <img src="foto2.jpg" alt="Momento juntos 2">
          <p>Risas inolvidables 💖</p>
        </div>
        <div class="polaroid">
          <img src="foto3.jpg" alt="Momento juntos 3">
          <p>Siempre tú 🌷</p>
        </div>
      </div>
    </section>

    <!-- Corazón Interactivo -->
    <div class="interactive-heart-container">
      <button id="heart-btn" class="pulse-heart">❤️</button>
      <p class="heart-hint">Tócame para una sorpresa</p>
    </div>

    <!-- Mensaje Final con Iniciales -->
    <footer class="final-message">
      <h2 class="constellation-title">✨ A y M ✨</h2>
      <p class="final-text">"Te elegiría una y mil veces." 🌷❤️</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
